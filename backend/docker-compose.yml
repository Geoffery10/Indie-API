services:
  indie-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - HomeAssistant__BaseUrl=${HomeAssistant__BaseUrl}
      - HomeAssistant__Token=${HomeAssistant__Token}
      - Immich__BaseUrl=${Immich__BaseUrl}
      - Immich__ApiKey=${Immich__ApiKey}
    volumes:
      - ./IndieAPI.Api/Data:/app/Data
    restart: unless-stopped
